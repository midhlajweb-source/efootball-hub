<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eFootball Cup — Tournament Hub</title>
    <meta
      name="description"
      content="Follow the eFootball Cup: live match status, the league table, and the knockout bracket, all in one broadcast-grade hub."
    />
    <meta name="theme-color" content="#0b1512" />
    <meta property="og:title" content="eFootball Cup — Tournament Hub" />
    <meta
      property="og:description"
      content="Follow the eFootball Cup: live match status, the league table, and the knockout bracket, all in one broadcast-grade hub."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://caffeine.ai/imgs/share-logo.jpeg" />
    <meta property="og:image:alt" content="Built with caffeine.ai" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://caffeine.ai/imgs/share-logo.jpeg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script>
      // Apply the persisted theme before first paint to avoid a flash of the
      // wrong theme. Kept inline and dependency-free on purpose.
      (function () {
        try {
          var stored = localStorage.getItem("efootball-cup-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          var root = document.documentElement;
          root.classList.toggle("dark", theme === "dark");
          root.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
